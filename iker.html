<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quién eres?</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131c;
      --border: #2a2a3d;
      --accent: #7c3aed;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #6b6b8a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(124,58,237,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 70%, rgba(167,139,250,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 2rem;
    }

    /* PANTALLA PREGUNTA */
    #screen-question {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
      font-weight: 600;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.1;
      color: var(--text);
    }

    h1 span {
      color: var(--accent2);
    }

    .input-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    .error-msg {
      font-size: 0.8rem;
      color: #f87171;
      min-height: 1.2em;
      transition: opacity 0.2s;
      opacity: 0;
    }

    .error-msg.visible {
      opacity: 1;
    }

    button {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    button:hover {
      background: var(--accent2);
      color: var(--bg);
      transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }

    /* PANTALLA RESPUESTA */
    #screen-reveal {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
      animation: fadeUp 0.6s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .photo-frame {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .photo-frame::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--accent), var(--accent2), var(--accent));
      animation: spin 3s linear infinite;
      z-index: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .photo-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface);
      border: 4px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Foto placeholder si no hay imagen */
    .photo-placeholder {
      font-size: 5rem;
      line-height: 1;
    }

    .reveal-name {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      line-height: 1.2;
    }

    .reveal-name .highlight {
      display: block;
      color: var(--accent2);
    }

    .confetti-row {
      font-size: 1.8rem;
      letter-spacing: 0.1em;
      animation: bounce 1s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: scale(1); }
      to   { transform: scale(1.12); }
    }

    .back-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.6rem 1.2rem;
      width: auto;
    }

    .back-btn:hover {
      border-color: var(--accent2);
      color: var(--accent2);
      background: transparent;
    }

    /* PANTALLA VIDEO */
    #screen-video {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
      animation: fadeUp 0.5s ease forwards;
    }

    #screen-video h2 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      color: #f87171;
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #f8717144;
      box-shadow: 0 0 32px rgba(248,113,113,0.2);
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Partículas */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent2);
      opacity: 0;
      animation: floatUp var(--dur) ease-in infinite;
      animation-delay: var(--delay);
      left: var(--x);
      top: 110%;
    }

    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-120vh) scale(0.3); }
    }
  </style>
</head>
<body>

  <!-- Partículas de fondo -->
  <div class="particles" id="particles"></div>

  <div class="container">

    <!-- Pantalla: Pregunta -->
    <div id="screen-question">
      <div>
        <p class="eyebrow">Página secreta</p>
        <h1>¿Cuál es tu <span>nombre?</span></h1>
      </div>

      <div class="input-wrap">
        <label for="nameInput">Escribe tu nombre completo</label>
        <input
          type="text"
          id="nameInput"
          placeholder="Nombre y apellidos..."
          autocomplete="off"
        />
        <span class="error-msg" id="errorMsg">Ese nombre no coincide. ¡Inténtalo de nuevo!</span>
      </div>

      <button onclick="checkName()">Confirmar →</button>
    </div>

    <!-- Pantalla: Video (nombre incorrecto) -->
    <div id="screen-video">
      <h2>❌ Ese no es tu nombre...</h2>
      <div class="video-wrap">
        <iframe
          id="ytPlayer"
          src=""
          allow="autoplay; encrypted-media"
          allowfullscreen
        ></iframe>
      </div>
      <button class="back-btn" onclick="goBack()">← Intentar de nuevo</button>
    </div>

    <!-- Pantalla: Reveal -->
    <div id="screen-reveal">
      <div class="confetti-row">🎉 ✨ 🎊</div>

      <div class="photo-frame">
        <div class="photo-inner">
          <!--
            ═══════════════════════════════════════
            PARA AÑADIR LA FOTO DE IKER:
            Reemplaza el emoji de abajo por:
            <img src="foto_iker.jpg" alt="Iker Abelairas Mosquera">
            ═══════════════════════════════════════
          -->
          <div class="photo-placeholder">🧑</div>
        </div>
      </div>

      <div class="reveal-name">
        ¡Bienvenido,
        <span class="highlight">Iker Abelairas Mosquera!</span>
      </div>

      <p style="color: var(--muted); font-size: 0.9rem;">
        Esta página fue hecha especialmente para ti 💜
      </p>

      <button class="back-btn" onclick="goBack()">← Volver</button>
    </div>

  </div>

  <script>
    // Generar partículas flotantes
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.setProperty('--x', Math.random() * 100 + 'vw');
      p.style.setProperty('--dur', (8 + Math.random() * 12) + 's');
      p.style.setProperty('--delay', (Math.random() * 10) + 's');
      if (Math.random() > 0.5) p.style.background = '#a78bfa';
      container.appendChild(p);
    }

    function normalize(str) {
      return str
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function checkName() {
      const input = document.getElementById('nameInput').value;
      const target = 'iker abelairas mosquera';

      if (normalize(input) === target) {
        document.getElementById('screen-question').style.display = 'none';
        const reveal = document.getElementById('screen-reveal');
        reveal.style.display = 'flex';
      } else if (input.trim() !== '') {
        document.getElementById('screen-question').style.display = 'none';
        const videoScreen = document.getElementById('screen-video');
        videoScreen.style.display = 'flex';
        // Autoplay activado
        document.getElementById('ytPlayer').src =
          'https://www.youtube.com/embed/pjhyVVKs39A?autoplay=1';
      }
    }

    function goBack() {
      document.getElementById('screen-reveal').style.display = 'none';
      document.getElementById('screen-video').style.display = 'none';
      // Parar el video quitando el src
      document.getElementById('ytPlayer').src = '';
      document.getElementById('screen-question').style.display = 'flex';
      document.getElementById('nameInput').value = '';
    }

    // Permitir pulsar Enter
    document.getElementById('nameInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkName();
    });
  </script>
</body>
</html>
